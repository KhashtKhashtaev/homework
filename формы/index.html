<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khasht</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<form>
    <fieldset>
        <legend>Ваши личные данные</legend>
        <label class="label-1">
            Ваше имя
            <input class="input" class="input-1" type="text" name="name" placeholder="Имя" required>
        </label>
        <label>
         Ваш возраст
            <input class="input" type="number" name="namber" placeholder=" возраст" required>
        </label>
        <label>
            Ваш номер телефона
            <input class="input" type="tel" name="tel" placeholder="Номер телефона" required inputmode="tel">
        </label>
        <label>
            Ваша почта
            <input class="input" type="email" name="email" placeholder="Ваша почта" required inputmode="email">
        </label>
        <label>
            Ваше сообщение
            <textarea class="input" name="message" placeholder="Ваше сообщение" required></textarea>
        </label>
        <label class="label-2">
        <input class="input-2" type="checkbox" name="checkboxs" required>
        Я согласен с условиями
        </label>
        <button type="submit">Отправить</button>
    </fieldset>
</form>
</body>
</html>
