<!doctype html>
<html class="page" lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css">
    <script src="./js/index.js" type="module"></script>
    <title>Dyson</title>
</head>

<body class="page__body">
    <header class="header">
        <div class="header__container container">
            <div class="burger">
                <button class="burger__menu #burger__menu burger--open
                title=" навигация по сайту aria-label="открыть меню" aria-expanded="false"
                    aria-controls="burger__menu">
                    <svg width="50" height="50">
                        <use class="burger__icon-menu" href="./icons/burger.svg#burger__icon-menu"></use>
                        <use class="burger__icon-cross" href="./icons/burger.svg#burger__icon-cross"></use>
                    </svg>
                </button>
                <a class="header__logo-link" href="#"><img class="header__logo" src="./icons/logo.svg" width="183"
                        height="77" alt="логотип"></a>
            </div>
            <ul class="header__menu header__menu--open">
                <li class="menu__item"><a class="menu__link" href="#">о нас</a></li>
                <li class="menu__item"><a class="menu__link" href="#">Доставка и оплата</a></li>
                <li class="menu__item"><a class="menu__link" href="#">Регистрация продукта</a></li>
                <li class="menu__item"><a class="menu__link" href="#">Сервис</a></li>
                <li class="menu__item"><a class="menu__link" href="#">Сертификаты и лицензии</a></li>
            </ul>
            <div class="header__button">
                <button class="header__basket">
                    <svg width="36" height="36">
                        <use class="basket" href="./icons/Frame 19.svg#basket"></use>
                    </svg>
                </button>
            </div>
        </div>
    </header>
</body>

</html>
