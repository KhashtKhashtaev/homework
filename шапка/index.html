<!doctype html>
<html class="page" lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css">
    <link rel="icon" href="./icons/nike-favicon-32x32 (1).ico" type="image/svg+xml">
    <script defer src="./js/index.js" type="module"></script>
    <title>NIKE AIR MAG</title>
</head>
<body class="page__body">
    <header class="header header--fixed">
        <div class="header__container container">
            <a class="header__logo logo" href="#"><img class="header__logo-img" width="50" height="20" src="./icons/Vector.svg" alt="логотип"></a>
            <nav class="header__menu menu" id="header__nav" aria-label="Навигация по сайту">
                <ul class="menu__list">
                    <li class="menu__item"><a class="menu__link" href="#Air Mag" lang="en">Air Mag</a></li>
                    <li class="menu__item"><a class="menu__link" href="#sizes">Размеры</a></li>
                    <li class="menu__item"><a class="menu__link" href="#specifications">Характеристики</a></li>
                    <li class="menu__item"><a class="menu__link" href="#top-models">Другие ТОП модели</a></li>
                </ul>
            </nav>
            <div class="header__controls">
                <a class="header__order" href="#">Сделать заказ</a>
                <div class="header__actions">
                    <button class="header__actions-button" title="Поиск" aria-label="Поиск">
                        <svg width="24" height="24">
                            <use class="header__actions-icon" href="./icons/sprite.svg#search"></use>
                        </svg>
                    </button>
                    <button class="header__actions-button" title="Корзина" aria-label="Корзина">
                        <svg width="24" height="24">
                            <use class="header__actions-icon" href="./icons/sprite.svg#cart"></use>
                        </svg>
                    </button>
                    <button class="header__burger burger" title="Меню" aria-label="Открыть меню" aria-expanded="false" aria-controls="header__nav">
                        <svg width="24" height="24">
                            <use class="burger__icon-menu" href="./icons/sprite.svg#burger-menu"></use>
                            <use class="burger__icon-cross" href="./icons/sprite.svg#burger-cross"></use>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
