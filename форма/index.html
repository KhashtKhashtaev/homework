<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Статья</title>
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <form class="form">
        <fieldset>
            <legend>Ваши личные данные</legend>
            <label class="label-1" for="name">Ваше имя</label>
            <input class="input-fields" id="name" name="name" type="text" required placeholder="Имя">
            <label for="surname">Ваш возраст</label>
            <input class="input-fields" id="surname" name="surname" type="text" required placeholder="Возраст">
            <label for="tel">Ваш номер телефона</label>
            <input class="input-fields" id="tel" name="tel" type="tel" required inputmode="tel"
                placeholder="Номер телефона">
            <label for="email">Ваша почта</label>
            <input class="input-fields" id="email" name="email" type="email" required placeholder="Ваша почта"
                inputmode="email">
            <label for="message">Ваше сообщение</label>
            <textarea class="input-fields" id="message" name="textarea" required
                placeholder="Ваше сообщение"></textarea>
            <label class="upproad" for="checkbox">
                <input class="checkbox" id="checkbox" type="checkbox" name="checkbox" required>
                Я принимаю правила</label>
            <button>Отправить</button>
        </fieldset>
    </form>
    </div>
</body>

</html>
